{{- if .Values.waitForMetalNode }}
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: job-wait-for-metal-node
  namespace: {{ .Values.vmNamespace }}
spec:
  # A drain-evicted (cancelled) pod is ignored rather than counted as a
  # failure: the Job stays incomplete and a replacement pod resumes the
  # wait. Only genuine failures count toward backoffLimit.
  podFailurePolicy:
    rules:
      - action: Ignore
        onExitCodes:
          containerName: wait-for-metal-node
          operator: In
          values: [143]
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  template:
    spec:
      containers:
      - image: {{ .Values.job.image }}
        command:
        - /bin/bash
        - -c
        - |
          # Exit promptly with a nonzero code on SIGTERM so node drains can
          # cancel this Job without it being marked successful.
          trap 'echo "Cancelled by SIGTERM; exiting 143 without success"; exit 143' TERM
          while [ 1 ];
          do
            nodes=$(oc get machinesets.machine.openshift.io -n openshift-machine-api -l 'edge-gitops-role=kubevirt-worker' -o jsonpath='{.items[*].status.availableReplicas}' | sed -e 's/ //g')
            if [ "0$nodes" -ge "1" ]; then
              echo "Node is ready, exiting"
              exit 0
            fi
            echo "Node is not yet ready, waiting"
            sleep 15
          done
        name: wait-for-metal-node
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      serviceAccount: {{ .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: {{ .Values.jobTerminationGracePeriod }}
{{- end }}
